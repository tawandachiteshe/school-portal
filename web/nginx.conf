# Static file server for the React build. Routing, TLS and /api, /auth path rules are
# handled by Dokploy (Traefik) in front of this container (docs/06 §6.7).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker and manifest must always be revalidated
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback so deep links like /modules/DCN201 work
    location / {
        try_files $uri /index.html;
    }
}
