[project]
name = "tcfl-portal-api"
version = "0.1.0"
description = "TCFL Portal API: onboarding, OCR, academics, assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.4",
  "anthropic>=0.40",
  "rapidfuzz>=3.9",
  "gunicorn>=26.2.0",
  "cryptography>=50.0.1",
  "boto3>=1.43.103",
]

[project.optional-dependencies]
# Heavy OCR stack: installed in the worker image only.
ocr = ["paddleocr>=3.0", "opencv-python-headless>=4.10", "pytesseract>=0.3"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"app/seed.py" = ["E501"]  # sample-data strings
