# Campus Portal: groups, OIDC provider and application (docs/10 §10.3, §10.8).
# Flows (tcfl-authentication, tcfl-enrollment, tcfl-recovery, tcfl-invitation) live in
# sibling files exported from the admin UI.
# Check model/field names against the running version: /blueprints/schema.json in the container.
version: 1
metadata:
  name: Campus Portal
entries:
  - model: authentik_core.group
    id: staff
    identifiers: { name: portal-staff }
  - model: authentik_core.group
    identifiers: { name: portal-lecturers }
    attrs: { parent: !KeyOf staff }
  - model: authentik_core.group
    identifiers: { name: portal-admissions }
    attrs: { parent: !KeyOf staff }
  - model: authentik_core.group
    identifiers: { name: portal-registry }
    attrs: { parent: !KeyOf staff }
  - model: authentik_core.group
    identifiers: { name: portal-librarians }
    attrs: { parent: !KeyOf staff }
  - model: authentik_core.group
    identifiers: { name: portal-student-affairs }
    attrs: { parent: !KeyOf staff }
  - model: authentik_core.group
    identifiers: { name: portal-accounts }
    attrs: { parent: !KeyOf staff }
  - model: authentik_core.group
    identifiers: { name: portal-admins }
    attrs: { parent: !KeyOf staff }
  - model: authentik_core.group
    identifiers: { name: portal-students }
  - model: authentik_core.group
    identifiers: { name: portal-applicants }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers: { name: tcfl-portal }
    attrs:
      client_type: confidential
      # Authentik 2026: grant types are opt-in per provider.
      grant_types: [authorization_code, refresh_token]
      # RS256 ID tokens the portal checks against the JWKS (docs/10 §10.3 "Signing key").
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_id: tcfl-portal
      client_secret: !Env OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # Signing out of the portal ends the Authentik session too, then comes back to /login.
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      # The portal's own address (APP_URL: https://portal.tcfl.ac.zw in production, the Vite dev
      # server in development).
      redirect_uris:
        - { matching_mode: strict, url: !Format ["%s/api/auth/callback", !Env [APP_URL, "http://localhost:5173"]] }
        - matching_mode: strict
          url: !Format ["%s/login", !Env [APP_URL, "http://localhost:5173"]]
          redirect_uri_type: logout
      sub_mode: user_uuid
      access_token_validity: minutes=5
      refresh_token_validity: days=14
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

  - model: authentik_core.application
    identifiers: { slug: tcfl-portal }
    attrs:
      name: Campus Portal
      provider: !KeyOf provider
      meta_launch_url: !Format ["%s/", !Env [APP_URL, "http://localhost:5173"]]
