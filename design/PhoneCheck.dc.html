<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check your ID details</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tcfl.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="tc {{theme}}" style="width: 390px; height: 1080px; display: flex; flex-direction: column">
<header class="bar" style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex: none">
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-weight: 700; letter-spacing: 0.02em">TCFL</span><span class="muted">Portal</span></div>
<span class="sm muted" style="display: inline-flex; align-items: center; gap: 6px"><svg class="ic ic16" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>Linked · <span class="mono">K7Q2</span></span>
</header>
<main style="padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; flex-grow: 1">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="h1">Check your ID details</h1>
<p class="muted">We filled these in from your photo. Change anything we got wrong.</p>
</div>

<div style="display: flex; gap: 12px; align-items: center">
<div aria-hidden="true" style="width: 96px; height: 61px; border-radius: 4px; background: var(--muted); border: 1px solid var(--border); padding: 8px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; flex: none">
<span class="skel" style="background: var(--border-strong); height: 100%"></span>
<span style="display: flex; flex-direction: column; gap: 5px"><span style="height: 4px; width: 90%; background: var(--border-strong); border-radius: 1px"></span><span style="height: 4px; width: 70%; background: var(--border-strong); border-radius: 1px"></span><span style="height: 4px; width: 80%; background: var(--border-strong); border-radius: 1px"></span></span>
</div>
<div style="flex-grow: 1"><div class="fw5">Photo of the front</div><div class="sm muted">Taken 09:41 on this phone</div></div>
<button class="btn btn-ghost">Retake</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border)">
<span class="label">ID number</span>
<span class="mono" style="font-size: 24px; line-height: 32px; font-weight: 500">63-2047823 Q 29</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span class="badge badge-success"><svg class="ic ic16" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg>Check letter valid</span>
<span class="sm muted">Registered in Harare · Origin Gweru</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label class="label" for="sn">Surname</label>
<input class="input" id="sn" value="MOYO" autocomplete="family-name">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="label" for="fn">First names</label>
<input class="input" id="fn" value="TARIRO" autocomplete="given-name">
</div>
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px">
<legend class="label" style="padding: 0; margin-bottom: 6px">Date of birth</legend>
<div style="display: flex; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; width: 64px"><label class="hint" for="dd">Day</label><input class="input" id="dd" value="14" inputmode="numeric"></div>
<div style="display: flex; flex-direction: column; gap: 4px; width: 64px"><label class="hint" for="mm">Month</label><input class="input" id="mm" value="05" inputmode="numeric"></div>
<div style="display: flex; flex-direction: column; gap: 4px; width: 96px"><label class="hint" for="yy">Year</label><input class="input" id="yy" value="2006" inputmode="numeric"></div>
</div>
</fieldset>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button class="btn btn-primary btn-block">Save ID details</button>
<p class="sm muted" style="text-align: center">Saving also updates your computer screen.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
