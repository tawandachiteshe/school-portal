<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a programme</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tcfl.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="tc {{theme}}" style="width: 390px; height: 1100px; display: flex; flex-direction: column">
<header class="bar" style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px; flex: none">
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-weight: 700; letter-spacing: 0.02em">TCFL</span><span class="muted">Portal</span></div>
<button class="btn btn-ghost">Save and exit</button>
</header>
<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
<div class="sm" style="display: flex; justify-content: space-between"><span class="fw5">Step 1 of 5 · Programme</span><span class="muted">Next: National ID</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-label="Step 1 of 5"><span class="seg on"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span></div>
</div>
<main style="padding: 24px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="h1">Choose a programme</h1>
<p class="muted">Check the entry requirements first. You can change this until you submit.</p>
</div>
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Programme</legend>
<label class="card" style="display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 12px; padding: 16px; border-color: var(--primary); background: var(--primary-soft); cursor: pointer">
<span class="radio on" style="margin-top: 2px"></span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span class="fw6">Diploma in Information Technology</span>
<span class="sm muted">HEXCO National Diploma · 3 years</span>
<span class="sm" style="margin-top: 4px">Entry: 5 O-Levels at C or better, including English Language and Mathematics</span>
</span>
</label>
<label class="card" style="display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 12px; padding: 16px; cursor: pointer">
<span class="radio" style="margin-top: 2px"></span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span class="fw5">Diploma in Software Engineering</span>
<span class="sm muted">HEXCO National Diploma · 3 years</span>
<span class="sm" style="margin-top: 4px">Entry: 5 O-Levels at C or better, including English Language and Mathematics</span>
</span>
</label>
<label class="card" style="display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 12px; padding: 16px; cursor: pointer">
<span class="radio" style="margin-top: 2px"></span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span class="fw5">Diploma in Telecommunications Engineering</span>
<span class="sm muted">HEXCO National Diploma · 3 years</span>
<span class="sm" style="margin-top: 4px">Entry: 5 O-Levels at C or better, including English Language, Mathematics and Physical Science</span>
</span>
</label>
<label class="card" style="display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 12px; padding: 16px; cursor: pointer">
<span class="radio" style="margin-top: 2px"></span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span class="fw5">Certificate in Computer Networking</span>
<span class="sm muted">HEXCO National Certificate · 2 years</span>
<span class="sm" style="margin-top: 4px">Entry: 5 O-Levels at C or better, including English Language and Mathematics</span>
</span>
</label>
</fieldset>
</main>
<div class="bar" style="margin-top: auto; border-top: 1px solid var(--border); border-bottom: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px">
<span class="sm muted">Selected: <span class="fg fw5">Diploma in Information Technology</span></span>
<button class="btn btn-primary btn-block">Continue</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
