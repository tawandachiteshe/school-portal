<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment didn't go through</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tcfl.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="tc {{theme}}" style="width: 390px; height: 900px; display: flex; flex-direction: column">
<header class="bar" style="height: 56px; display: flex; align-items: center; padding: 0 16px; flex: none">
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-weight: 700; letter-spacing: 0.02em">TCFL</span><span class="muted">Portal</span></div>
</header>
<main style="padding: 32px 16px 24px; display: flex; flex-direction: column; gap: 24px; flex-grow: 1">
<div role="alert" style="display: flex; flex-direction: column; gap: 12px">
<svg class="ic danger" viewBox="0 0 24 24" style="width: 32px; height: 32px"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
<h1 class="h1">Payment didn't go through</h1>
<p>EcoCash said there isn't enough money in the wallet for <span class="mono fw6">US$ 20.00</span>. No money was taken.</p>
</div>
<div class="alert alert-info">
<svg class="ic primary" viewBox="0 0 24 24" style="margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<p class="sm">Your application is saved, but it hasn't been sent to Admissions yet. It will be sent when the fee is paid.</p>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a class="btn btn-primary btn-block" href="PayWaiting.dc.html">Try EcoCash again</a>
<a class="btn btn-secondary btn-block" href="Payment.dc.html">Pay another way</a>
<a class="tlink" href="#" style="justify-content: center">Save and pay later</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":900}}'>

  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
