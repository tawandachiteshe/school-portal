# Production stack for Dokploy (Compose deployment, compose path: docker-compose.prod.yml).
# No host ports. Routing is in the Traefik labels below (Dokploy's Traefik reads them from
# containers on dokploy-network), so there's nothing to add in Dokploy's Domains tab.
# Cloudflare holds the public certificate. Each route answers on both of Dokploy's entrypoints:
# http (SSL mode Flexible) and https with Traefik's own certificate (SSL mode Full, which encrypts
# Cloudflare to the server too). Either way the apps are told the visitor came over https:
#   https://${APP_HOST}/       → web:80
#   https://${APP_HOST}/api    → tcfl-api:8000         (/api stripped)
#   https://${APP_HOST}/auth   → tcfl-authentik:9000   (Authentik serves under /auth/)
#   https://${ID_HOST}/        → tcfl-authentik:9000   (the admin console; / goes to /auth/if/admin/)
# Environment variables are set in Dokploy's Environment tab (template: .env.production.example).
# Stops the deploy with a clear message when the hosts aren't set (Compose checks extension fields too).
x-required-hosts:
  - "${APP_HOST:?APP_HOST is missing - paste .env.production into Dokploy's Environment tab}"
  - "${ID_HOST:?ID_HOST is missing - paste .env.production into Dokploy's Environment tab}"
# Addresses of the stack's own services. Every service on dokploy-network is visible to every other
# Dokploy app, so a plain name like `postgres` can reach another app's database. These tcfl-* names
# exist only on this stack's network and override whatever the Environment tab says.
x-internal: &internal
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tcfl-postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://tcfl-redis:6379/0
  S3_ENDPOINT: http://tcfl-s3:8333
  OIDC_INTERNAL_BASE_URL: http://tcfl-authentik:9000
  AUTHENTIK_API_URL: http://tcfl-authentik:9000/auth/api/v3/
services:
  postgres:
    networks: { default: { aliases: [tcfl-postgres] } }
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing - paste .env.production into Dokploy's Environment tab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - paste .env.production into Dokploy's Environment tab}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing - paste .env.production into Dokploy's Environment tab}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"], interval: 5s }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: { default: { aliases: [tcfl-redis] } }
    restart: unless-stopped

  # S3-compatible object storage (SeaweedFS). MinIO no longer publishes free images; the API
  # only speaks S3, so any S3 store works (S3_ENDPOINT). Credentials come from S3_ACCESS_KEY/S3_SECRET_KEY.
  s3:
    networks: { default: { aliases: [tcfl-s3] } }
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"portal","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is missing - paste .env.production into Dokploy's Environment tab}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is missing - paste .env.production into Dokploy's Environment tab}
    volumes: [s3data:/data]
    restart: unless-stopped

  api:
    build: { context: ./api, target: prod }
    env_file: .env
    # Migrations and storage buckets on every start (both are safe to repeat), then the API.
    command: >-
      sh -c "alembic upgrade head && python -m app.storage &&
      exec gunicorn -k uvicorn.workers.UvicornWorker -w $${WEB_CONCURRENCY:-2} -b 0.0.0.0:8000 app.main:app"
    environment:
      <<: *internal
      # Only Traefik reaches the API: trust its X-Forwarded-For, so audit logs keep the visitor's IP.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    networks: { default: { aliases: [tcfl-api] }, dokploy-network: {} }
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.tcfl-api.rule=Host(`${APP_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tcfl-api-tls.rule=Host(`${APP_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tcfl-api-tls.entrypoints=websecure"
      - "traefik.http.routers.tcfl-api-tls.tls=true"
      - "traefik.http.routers.tcfl-api.entrypoints=web"
      - "traefik.http.routers.tcfl-api.middlewares=tcfl-api-strip@docker,tcfl-https-proto@docker"
      - "traefik.http.routers.tcfl-api-tls.middlewares=tcfl-api-strip@docker,tcfl-https-proto@docker"
      - "traefik.http.routers.tcfl-api.service=tcfl-api"
      - "traefik.http.routers.tcfl-api-tls.service=tcfl-api"
      - "traefik.http.services.tcfl-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.tcfl-api-strip.stripprefix.prefixes=/api"

  # Background jobs: scheduled announcements, SMS (app/worker.py). One instance: it also runs beat.
  worker:
    build: { context: ./api, target: prod }
    env_file: .env
    command: celery -A app.worker worker -B --loglevel=info
    environment: *internal
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  web:
    build: { context: ./web, target: prod, args: { VITE_COLLEGE_NAME: "${COLLEGE_NAME:-Campus College}" } }
    restart: unless-stopped
    networks: [default, dokploy-network]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.tcfl-web.rule=Host(`${APP_HOST}`) && !PathPrefix(`/api`) && !PathPrefix(`/auth`)"
      - "traefik.http.routers.tcfl-web-tls.rule=Host(`${APP_HOST}`) && !PathPrefix(`/api`) && !PathPrefix(`/auth`)"
      - "traefik.http.routers.tcfl-web-tls.entrypoints=websecure"
      - "traefik.http.routers.tcfl-web-tls.tls=true"
      - "traefik.http.routers.tcfl-web.entrypoints=web"
      - "traefik.http.routers.tcfl-web.middlewares=tcfl-https-proto@docker"
      - "traefik.http.routers.tcfl-web-tls.middlewares=tcfl-https-proto@docker"
      - "traefik.http.routers.tcfl-web.service=tcfl-web"
      - "traefik.http.routers.tcfl-web-tls.service=tcfl-web"
      - "traefik.http.services.tcfl-web.loadbalancer.server.port=80"
      - "traefik.http.middlewares.tcfl-https-proto.headers.customrequestheaders.X-Forwarded-Proto=https"

  authentik-db:
    image: postgres:16-alpine
    networks: { default: { aliases: [tcfl-authentik-db] } }
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:?AUTHENTIK_PG_PASS is missing - paste .env.production into Dokploy's Environment tab}
    volumes: [authentik-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"], interval: 10s }
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.3}
    command: server
    env_file: .env
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: tcfl-authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:?AUTHENTIK_PG_PASS is missing - paste .env.production into Dokploy's Environment tab}
      AUTHENTIK_WEB__PATH: /auth/
      # SMS codes go to the portal API (app/api/sms.py), on this stack's network only.
      PORTAL_SMS_WEBHOOK_URL: http://tcfl-api:8000/internal/sms
    volumes:
      - authentik-data:/data
      - ./infra/authentik/blueprints:/blueprints/custom:ro
      - ./infra/authentik/custom-templates:/templates
    shm_size: 512mb
    depends_on: { authentik-db: { condition: service_healthy } }
    restart: unless-stopped
    networks: { default: { aliases: [tcfl-authentik] }, dokploy-network: {} }
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.tcfl-auth.rule=Host(`${APP_HOST}`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.tcfl-auth-tls.rule=Host(`${APP_HOST}`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.tcfl-auth-tls.entrypoints=websecure"
      - "traefik.http.routers.tcfl-auth-tls.tls=true"
      - "traefik.http.routers.tcfl-auth.entrypoints=web"
      - "traefik.http.routers.tcfl-auth.middlewares=tcfl-https-proto@docker"
      - "traefik.http.routers.tcfl-auth-tls.middlewares=tcfl-https-proto@docker"
      - "traefik.http.routers.tcfl-auth.service=tcfl-auth"
      - "traefik.http.routers.tcfl-auth-tls.service=tcfl-auth"
      - "traefik.http.services.tcfl-auth.loadbalancer.server.port=9000"
      - "traefik.http.routers.tcfl-id.rule=Host(`${ID_HOST}`)"
      - "traefik.http.routers.tcfl-id-tls.rule=Host(`${ID_HOST}`)"
      - "traefik.http.routers.tcfl-id-tls.entrypoints=websecure"
      - "traefik.http.routers.tcfl-id-tls.tls=true"
      - "traefik.http.routers.tcfl-id.entrypoints=web"
      - "traefik.http.routers.tcfl-id.middlewares=tcfl-id-admin@docker,tcfl-https-proto@docker"
      - "traefik.http.routers.tcfl-id-tls.middlewares=tcfl-id-admin@docker,tcfl-https-proto@docker"
      - "traefik.http.routers.tcfl-id.service=tcfl-auth"
      - "traefik.http.routers.tcfl-id-tls.service=tcfl-auth"
      - "traefik.http.middlewares.tcfl-id-admin.redirectregex.regex=^https?://[^/]+/$$"
      - "traefik.http.middlewares.tcfl-id-admin.redirectregex.replacement=https://${ID_HOST}/auth/if/admin/"

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.3}
    command: worker
    env_file: .env
    environment: *authentik-env
    volumes:
      - authentik-data:/data
      - ./infra/authentik/blueprints:/blueprints/custom:ro
      - ./infra/authentik/custom-templates:/templates
    shm_size: 512mb
    depends_on: { authentik-db: { condition: service_healthy } }
    restart: unless-stopped

volumes: { pgdata: {}, s3data: {}, authentik-db: {}, authentik-data: {} }

# Dokploy's Traefik network (created by Dokploy on the server).
networks:
  dokploy-network:
    external: true
