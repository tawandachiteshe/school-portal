# Local development stack. Production overrides: docker-compose.prod.yml (docs/06 §6.7).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"], interval: 5s }

  redis:
    image: redis:7-alpine

  # S3-compatible object storage (SeaweedFS). -volume.max=0 sizes volume slots from free disk: each
  # bucket needs 7, so the default 8 fits only one. MinIO no longer publishes free images; the API
  # only speaks S3, so any S3 store works (S3_ENDPOINT). Credentials come from S3_ACCESS_KEY/S3_SECRET_KEY.
  s3:
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"portal","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [s3data:/data]
    ports: ["${S3_PORT:-8333}:8333"]

  api:
    build: { context: ./api, target: dev }
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./api/app:/app/app", "./api/alembic:/app/alembic"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Background jobs: scheduled announcements, SMS (app/worker.py). One instance: it also runs beat.
  worker:
    build: { context: ./api, target: dev }
    env_file: .env
    command: celery -A app.worker worker -B --loglevel=info
    volumes: ["./api/app:/app/app"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build: { context: ./web, target: dev }
    environment:
      API_PROXY_TARGET: http://api:8000
      AUTH_PROXY_TARGET: http://authentik-server:9000
    command: bun run dev --host 0.0.0.0
    volumes: ["./web:/app", "/app/node_modules"]
    ports: ["5173:5173"]

  # --- Authentik, served under /auth/ on the portal origin (docs/10 §10.2) ---
  authentik-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS}
    volumes: [authentik-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"], interval: 10s }

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    command: server
    env_file: .env
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_WEB__PATH: /auth/
    volumes:
      - authentik-data:/data
      - ./infra/authentik/blueprints:/blueprints/custom:ro
      - ./infra/authentik/custom-templates:/templates
    shm_size: 512mb
    depends_on: { authentik-db: { condition: service_healthy } }

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    command: worker
    env_file: .env
    environment: *authentik-env
    volumes: # no docker.sock: managed outposts are not used
      - authentik-data:/data
      - ./infra/authentik/blueprints:/blueprints/custom:ro
      - ./infra/authentik/custom-templates:/templates
    shm_size: 512mb
    depends_on: { authentik-db: { condition: service_healthy } }

volumes: { pgdata: {}, s3data: {}, authentik-db: {}, authentik-data: {} }
